version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: change-friction-db
    environment:
      POSTGRES_DB: change_friction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
